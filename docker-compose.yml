# Fixed so every worktree shares the same containers
name: movies

services:
  postgres:
    image: postgres:16
    container_name: postgres_local
    restart: unless-stopped
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: password
      POSTGRES_DB: movies
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  # Postgres for tests: make test loads movies_test and make e2e-db builds
  # movies_e2e_<port>, each from the calling checkout. It mounts no files,
  # since a mount resolves to one checkout's path, and starting the container
  # from another checkout would recreate it and wipe every database.
  postgres_test:
    image: postgres:15
    container_name: postgres_test
    restart: unless-stopped
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: password
      POSTGRES_DB: movies_test
    ports:
      - "5433:5432"
    healthcheck:
      # Over TCP: during init the server only listens on the socket
      test:
        [
          "CMD",
          "pg_isready",
          "-h",
          "127.0.0.1",
          "-U",
          "admin",
          "-d",
          "movies_test",
        ]
      interval: 1s
      retries: 30
    tmpfs:
      - /var/lib/postgresql/data

volumes:
  postgres_data:
