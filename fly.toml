# fly.toml app configuration file generated for movies-go on 2023-09-21T13:59:11+02:00

app = "movies-go"
primary_region = "arn"

[[vm]]
  size = "shared-cpu-2x"
  memory = "512mb"

[env]
  PORT = "8080"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

  # A new machine must answer before the deploy moves on. One whose
  # migrations fail exits instead, which fails the deploy.
  [[http_service.checks]]
    grace_period = "10s"
    interval = "30s"
    method = "GET"
    path = "/health"
    timeout = "5s"
