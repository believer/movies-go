name: Release

on:
  push:
    branches:
      - main

# Cancel previously running workflows
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Checks
    uses: ./.github/workflows/pr.yml

  deploy:
    name: Deploy app
    needs: [test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: superfly/flyctl-actions/setup-flyctl@master
      # Build with the Go version in go.mod, as the PR checks do
      - run: flyctl deploy --remote-only --build-arg GO_VERSION="$(sed -n 's/^go //p' go.mod)"
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

  smoke:
    name: Production smoke check
    timeout-minutes: 15
    needs: [deploy]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          # A version the runner image has cached, so setup-node doesn't download
          # one. Node only runs Playwright here.
          node-version: 24
      - name: Install dependencies
        run: npm install -g pnpm && pnpm install
      - name: Install Playwright Browsers
        run: pnpm exec playwright install --with-deps chromium
      - name: Run smoke check
        run: make smoke
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30
