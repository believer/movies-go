name: PR checks

on:
  pull_request:
  # Release runs these checks before deploying
  workflow_call:

# Cancel previously running checks on the same PR. When called from Release the
# group falls back to the run id, so it never collides with the caller's group.
concurrency:
  group: pr-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: admin
          POSTGRES_PASSWORD: password
          POSTGRES_DB: movies_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U admin -d movies_test"
          --health-interval 2s
          --health-retries 15
    env:
      TEST_DATABASE_URL: postgres://admin:password@localhost:5432/movies_test?sslmode=disable
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: "go.mod"
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Check
        run: make check
      - name: Load schema
        run: psql "$TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -q -f db/schema.sql
      - name: Load E2E seed
        # Builds movies_e2e from the schema and seed, so a schema change that
        # breaks the seed fails here
        run: make e2e-db PSQL="psql -h localhost -U admin"
        env:
          PGPASSWORD: password
      - name: Run tests
        # Packages share the test database, so run them one at a time
        run: go test -p 1 ./...
