name: PR checks

on:
  pull_request:
  # Release runs these checks before deploying
  workflow_call:

# Cancel previously running checks on the same PR. When called from Release the
# group falls back to the run id, so it never collides with the caller's group.
concurrency:
  group: pr-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  test:
    name: Test
    # Playwright 1.56 can't install Chromium on ubuntu-latest (26.04)
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: admin
          POSTGRES_PASSWORD: password
          POSTGRES_DB: movies_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U admin -d movies_test"
          --health-interval 2s
          --health-retries 15
    env:
      TEST_DATABASE_URL: postgres://admin:password@localhost:5432/movies_test?sslmode=disable
      E2E_DATABASE_URL: postgres://admin:password@localhost:5432/movies_e2e?sslmode=disable
      # make e2e-db, here and in Playwright's global setup, uses the service
      # Postgres instead of the postgres_test container
      PSQL: psql -h localhost -U admin
      PGPASSWORD: password
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: "go.mod"
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          # Playwright 1.56 hangs extracting Chromium on Node 26
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Check
        run: make check
      - name: Load schema
        run: psql "$TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -q -f db/schema.sql
      - name: Load E2E seed
        # Builds movies_e2e from the schema and seed, so a schema change that
        # breaks the seed fails here
        run: make e2e-db
      - name: Run tests
        # Packages share the test database, so run them one at a time
        run: go test -p 1 ./...
      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium
      - name: Run E2E tests
        # movies_e2e has to exist before Playwright starts the server
        run: pnpm exec playwright test --project=chromium
      - uses: actions/upload-artifact@v4
        if: ${{ failure() }}
        with:
          name: e2e-report
          path: playwright-report/
          retention-days: 30
