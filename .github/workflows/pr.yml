name: PR checks

on:
  pull_request:
  # Release runs these checks before deploying
  workflow_call:

# Cancel previously running checks on the same PR. When called from Release the
# group falls back to the run id, so it never collides with the caller's group.
concurrency:
  group: pr-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: admin
          POSTGRES_PASSWORD: password
          POSTGRES_DB: movies_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U admin -d movies_test"
          --health-interval 2s
          --health-retries 15
    env:
      TEST_DATABASE_URL: postgres://admin:password@localhost:5432/movies_test?sslmode=disable
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: "go.mod"
          # setup-go's cache is saved by whichever job finishes first, often
          # an E2E job that never builds the linters, mocks or tests. This job
          # saves the cache instead, and the E2E jobs only restore it.
          cache: false
      - uses: actions/cache@v6
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          # The Makefile pins the versions of templ, mockery and golangci-lint.
          # Keep the key in step with the E2E job's.
          key: go-${{ runner.os }}-${{ hashFiles('go.mod', 'go.sum', 'Makefile') }}
          restore-keys: go-${{ runner.os }}-
      # Biome is the only thing make check needs from node_modules. The version
      # comes from pnpm-lock.yaml.
      - uses: biomejs/setup-biome@v2
      - name: Check
        run: make check BIOME=biome
      - name: Check schema.sql matches the migrations
        # Migrates an empty database and dumps it, as make schema does
        run: make schema && git diff --exit-code db/schema.sql
      - name: Load schema
        run: psql "$TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -q -f db/schema.sql
      - name: Run tests
        # Packages share the test database, so run them one at a time.
        # -count=1 skips go test's cache, which is now restored between runs
        # and can't tell that the database changed.
        run: go test -count=1 -p 1 ./...

  e2e:
    name: E2E (${{ matrix.browser }})
    runs-on: ubuntu-latest
    strategy:
      # Finish every browser, so one failure doesn't hide another
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: admin
          POSTGRES_PASSWORD: password
          POSTGRES_DB: movies_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U admin -d movies_test"
          --health-interval 2s
          --health-retries 15
    env:
      E2E_POSTGRES_URL: postgres://admin:password@localhost:5432
      # make e2e-db, here and in Playwright's global setup, uses the service
      # Postgres instead of the postgres_test container
      PSQL: psql -h localhost -U admin
      PGPASSWORD: password
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: "go.mod"
          cache: false
      # The Test job saves this cache
      - uses: actions/cache/restore@v6
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-${{ runner.os }}-${{ hashFiles('go.mod', 'go.sum', 'Makefile') }}
          restore-keys: go-${{ runner.os }}-
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build E2E database
        # From the schema and seed, so a schema change that breaks the seed
        # fails here. The database has to exist before Playwright starts the
        # server.
        run: make e2e-db
      - name: Install Playwright browser
        run: pnpm exec playwright install --with-deps ${{ matrix.browser }}
      - name: Run E2E tests
        run: pnpm exec playwright test --project=${{ matrix.browser }}
      - uses: actions/upload-artifact@v7
        if: ${{ failure() }}
        with:
          name: e2e-report-${{ matrix.browser }}
          # The snapshots folder holds any visual baseline the run wrote, to
          # commit when a baseline is new or deleted on purpose
          path: |
            playwright-report/
            e2e/visual.spec.ts-snapshots/
          retention-days: 30
